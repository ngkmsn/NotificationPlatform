# Application Config
quarkus.application.name=notification-platform
quarkus.http.port=8080

# Database Configuration (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/notification_db}
quarkus.datasource.jdbc.max-size=32
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.acquisition-timeout=30s
quarkus.datasource.jdbc.idle-removal-interval=60s

# Hibernate ORM (Liquibase handles schema migrations)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Liquibase Configuration
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml
quarkus.liquibase.validate-on-migrate=true

# Kafka Configuration
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Redis Configuration (Shared State Store for Distributed Rate Limiting)
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.client-type=standalone
quarkus.redis.timeout=${REDIS_TIMEOUT:10s}
quarkus.redis.max-pool-size=${REDIS_MAX_POOL_SIZE:32}
quarkus.redis.max-pool-waiting=${REDIS_MAX_POOL_WAITING:64}
quarkus.redis.health.enabled=true


# Health Check Configuration
quarkus.smallrye-health.root-path=/q/health

# Outbox Publisher Configuration (Tuned: 1s interval, 250 batch size => 250 events/sec)
outbox.publisher.enabled=true
outbox.publisher.interval=1s
outbox.publisher.batch-size=250

# Notification Worker Configuration
notification.worker.enabled=true

# Mock Provider Configuration
mock.provider.enabled=true
mock.provider.mode=SUCCESS

# Firebase Push Notification Configuration
firebase.push.enabled=${FIREBASE_PUSH_ENABLED:true}
quarkus.google.cloud.project-id=${GOOGLE_CLOUD_PROJECT_ID:notification-a0c90}
quarkus.google.cloud.service-account-location=${GOOGLE_CLOUD_SERVICE_ACCOUNT_LOCATION:firebase-service-account.json}

# Worker Rate Limiting (Token Bucket - Tuned: 500 capacity, 150 req/s refill)
ratelimit.worker.enabled=${RATELIMIT_WORKER_ENABLED:true}
ratelimit.default.capacity=${RATELIMIT_DEFAULT_CAPACITY:500}
ratelimit.default.refill-rate=${RATELIMIT_DEFAULT_REFILL_RATE:150.0}

# Worker Retry Policy (Exponential Backoff + Jitter)
notification.worker.max-retries=${NOTIFICATION_WORKER_MAX_RETRIES:3}
retry.initial-delay-ms=${RETRY_INITIAL_DELAY_MS:1000}
retry.max-delay-ms=${RETRY_MAX_DELAY_MS:60000}
retry.multiplier=${RETRY_MULTIPLIER:2.0}
retry.jitter-enabled=${RETRY_JITTER_ENABLED:true}

# Worker Circuit Breaker (Distributed Redis-based)
circuitbreaker.enabled=${CIRCUIT_BREAKER_ENABLED:true}
circuitbreaker.failure-rate-threshold=${CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50.0}
circuitbreaker.minimum-number-of-calls=${CIRCUIT_BREAKER_MIN_CALLS:5}
circuitbreaker.sliding-window-duration-ms=${CIRCUIT_BREAKER_WINDOW_DURATION_MS:60000}
circuitbreaker.wait-duration-in-open-state-ms=${CIRCUIT_BREAKER_OPEN_WAIT_MS:30000}
circuitbreaker.permitted-number-of-calls-in-half-open-state=${CIRCUIT_BREAKER_HALF_OPEN_CALLS:3}
circuitbreaker.half-open-success-threshold=${CIRCUIT_BREAKER_HALF_OPEN_SUCCESS_THRESHOLD:2}

# Dead Letter Queue (DLQ) Configuration
notification.dlq.topic=${NOTIFICATION_DLQ_TOPIC:notification-dlq}

# Hardware Load Guard & Multi-tier Overload Protection (85% Throttle, 95% Cutoff)
hardware.guard.enabled=${HARDWARE_GUARD_ENABLED:true}
hardware.guard.check-interval=${HARDWARE_GUARD_CHECK_INTERVAL:5s}
hardware.guard.warning-threshold-percent=${HARDWARE_GUARD_WARNING_THRESHOLD:75.0}
hardware.guard.throttle-threshold-percent=${HARDWARE_GUARD_THROTTLE_THRESHOLD:85.0}
hardware.guard.cutoff-threshold-percent=${HARDWARE_GUARD_CUTOFF_THRESHOLD:95.0}
hardware.guard.cpu-threshold-percent=${HARDWARE_GUARD_CPU_THRESHOLD:85.0}
hardware.guard.ram-threshold-percent=${HARDWARE_GUARD_RAM_THRESHOLD:85.0}
hardware.guard.ram-cutoff-threshold-percent=${HARDWARE_GUARD_RAM_CUTOFF_THRESHOLD:95.0}
hardware.guard.recovery-threshold-percent=${HARDWARE_GUARD_RECOVERY_THRESHOLD:70.0}
hardware.guard.debounce-minutes=${HARDWARE_GUARD_DEBOUNCE_MINUTES:10}
hardware.guard.admin-recipient=${HARDWARE_GUARD_ADMIN_RECIPIENT:admin}
hardware.guard.simulation-mode=${HARDWARE_GUARD_SIMULATION_MODE:false}

# Test Profile Overrides
%test.outbox.publisher.enabled=false
%test.quarkus.otel.enabled=false
%test.ratelimit.worker.enabled=false
%test.circuitbreaker.enabled=false
%test.retry.jitter-enabled=false
%test.hardware.guard.enabled=false

# =======================================================
# Microservice Role Profiles (Container / Process Splitting)
# =======================================================

# 1. API Ingestion Microservice (Handles HTTP REST Traffic & Admin Dashboard)
%api.quarkus.application.name=notification-api-service
%api.quarkus.http.port=${PORT:8080}
%api.outbox.publisher.enabled=false
%api.notification.worker.enabled=false
%api.quarkus.liquibase.migrate-at-start=true
%api.mp.messaging.incoming.notification-critical-in.enabled=false
%api.mp.messaging.incoming.notification-high-in.enabled=false
%api.mp.messaging.incoming.notification-normal-in.enabled=false
%api.mp.messaging.incoming.notification-low-in.enabled=false

# 2. Outbox Publisher Microservice (Polls DB and dispatches events to Kafka)
%outbox.quarkus.application.name=notification-outbox-service
%outbox.quarkus.http.port=${PORT:8082}
%outbox.outbox.publisher.enabled=true
%outbox.outbox.publisher.interval=1s
%outbox.outbox.publisher.batch-size=250
%outbox.notification.worker.enabled=false
%outbox.quarkus.liquibase.migrate-at-start=false
%outbox.mp.messaging.incoming.notification-critical-in.enabled=false
%outbox.mp.messaging.incoming.notification-high-in.enabled=false
%outbox.mp.messaging.incoming.notification-normal-in.enabled=false
%outbox.mp.messaging.incoming.notification-low-in.enabled=false

# 3. Notification Worker Microservice (Consumes Kafka priority topics & calls providers)
%worker.quarkus.application.name=notification-worker-service
%worker.quarkus.http.port=${PORT:8083}
%worker.outbox.publisher.enabled=false
%worker.notification.worker.enabled=true
%worker.quarkus.liquibase.migrate-at-start=false

# Worker Incoming Channels (4 Priority Topics)
mp.messaging.incoming.notification-critical-in.connector=smallrye-kafka
mp.messaging.incoming.notification-critical-in.topic=notification-critical
mp.messaging.incoming.notification-critical-in.group.id=${NOTIFICATION_WORKER_GROUP:notification-worker-group}
mp.messaging.incoming.notification-critical-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notification-critical-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notification-critical-in.auto.offset.reset=earliest
mp.messaging.incoming.notification-critical-in.enable.auto.commit=false

mp.messaging.incoming.notification-high-in.connector=smallrye-kafka
mp.messaging.incoming.notification-high-in.topic=notification-high
mp.messaging.incoming.notification-high-in.group.id=${NOTIFICATION_WORKER_GROUP:notification-worker-group}
mp.messaging.incoming.notification-high-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notification-high-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notification-high-in.auto.offset.reset=earliest
mp.messaging.incoming.notification-high-in.enable.auto.commit=false

mp.messaging.incoming.notification-normal-in.connector=smallrye-kafka
mp.messaging.incoming.notification-normal-in.topic=notification-normal
mp.messaging.incoming.notification-normal-in.group.id=${NOTIFICATION_WORKER_GROUP:notification-worker-group}
mp.messaging.incoming.notification-normal-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notification-normal-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notification-normal-in.auto.offset.reset=earliest
mp.messaging.incoming.notification-normal-in.enable.auto.commit=false

mp.messaging.incoming.notification-low-in.connector=smallrye-kafka
mp.messaging.incoming.notification-low-in.topic=notification-low
mp.messaging.incoming.notification-low-in.group.id=${NOTIFICATION_WORKER_GROUP:notification-worker-group}
mp.messaging.incoming.notification-low-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notification-low-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notification-low-in.auto.offset.reset=earliest
mp.messaging.incoming.notification-low-in.enable.auto.commit=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.notification".level=DEBUG

# Vert.x event loop timeout buffer for container environments
quarkus.vertx.max-event-loop-execute-time=10s
quarkus.vertx.warning-exception-time=10s

# =======================================================
# OpenTelemetry Configuration (Distributed Tracing)
# =======================================================
quarkus.otel.enabled=${OTEL_ENABLED:true}
quarkus.otel.resource.attributes=service.name=notification-platform,service.version=1.0.0,deployment.environment=dev
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.traces.protocol=grpc

# =======================================================
# Micrometer / Prometheus Metrics Configuration
# =======================================================
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.enabled=true


