global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'notification-microservices'
    metrics_path: '/q/metrics'
    scrape_interval: 5s
    static_configs:
      - targets:
          - 'notification-api:8080'
          - 'notification-outbox:8082'
          - 'notification-worker:8083'
        labels:
          application: 'notification-platform'
          environment: 'dev'
